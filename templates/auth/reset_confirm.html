<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - PwnBox</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-icon">C</span>
                <span class="logo-text">PwnBox</span>
            </div>

            <h2>Set New Password</h2>
            <p style="text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 16px;">
                Setting new password for: <strong>{{ username }}</strong>
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="auth-flash">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required autofocus minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('auth.login') }}">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
