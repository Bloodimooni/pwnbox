{% extends "admin/base_admin.html" %}

{% block title %}Settings - Admin - PwnBox{% endblock %}
{% block page_header %}System Settings{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px;">
    <form method="POST">
        {% for setting in settings %}
        <div class="form-group">
            <label for="setting_{{ setting.key }}">{{ setting.key }}</label>
            <input type="text" id="setting_{{ setting.key }}" name="setting_{{ setting.key }}" value="{{ setting.value }}">
            <span class="text-muted" style="font-size: 11px;">Last updated: {{ setting.updated_at }}</span>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
{% endblock %}
