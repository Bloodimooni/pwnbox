services:
  corpchat:
    build: .
    container_name: pwnbox
    ports:
      - "8080:8080"
    volumes:
      - corpchat-data:/data
    environment:
      - SECRET_KEY=corpchat-ctf-secret-key-2026
      - FLASK_CONFIG=config.ProductionConfig
      - DATABASE_DIR=/data
      - UPLOAD_FOLDER=/data/uploads
      - LOG_DIR=/data/logs
    restart: unless-stopped

volumes:
  corpchat-data:
