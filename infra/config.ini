[general]
# Pre-built Docker image name (build with: docker build -t pwnbox-ctf ..)
image_name = pwnbox-ctf
# Max concurrent instances
max_instances = 10
# Hours before auto-destroy
instance_ttl_hours = 4
# Docker network for isolated instances
docker_network = pwnbox-net
docker_subnet = 172.20.0.0/16
# First usable container IP (.1 is gateway)
container_ip_start = 2
# Internal app port inside the container
container_app_port = 8080

[netbird]
# NetBird management server URL
management_url = https://netbird.bloodimooni.com:33073
# Setup key for the host machine
machine_setup_key = 74BCBCB1-31D8-479F-B9E9-F2292996BE06
# Setup key for players (unlimited uses with expiration)
player_setup_key = 840895B4-9A5B-4630-AC12-AAF1FBB8B8EE

[portal]
host = 0.0.0.0
port = 8888
secret_key = 9TVFIH8SERNEM7O6EW7WRB7VZDZLZE3E
# Password required to register for the CTF event
event_password = your-event-password-here

[paths]
# Where instance state is tracked
state_dir = ./pwnbox-machines
