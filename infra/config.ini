[general]
# Pre-built Docker image name (build with: docker build -t pwnbox-ctf ..)
image_name = pwnbox-ctf
# Max concurrent instances
max_instances = 50
# Hours before auto-destroy
instance_ttl_hours = 4
# Docker network for isolated instances
docker_network = pwnbox-net
docker_subnet = 172.20.0.0/16
# First usable container IP (.1 is gateway)
container_ip_start = 2
# Internal app port inside the container
container_app_port = 5000

[wireguard]
interface = wg0
port = 51820
# WireGuard VPN subnet
subnet = 10.13.37.0/24
server_address = 10.13.37.1/24
# Public IP or domain that users connect to
endpoint = YOUR_PUBLIC_IP
dns = 1.1.1.1

[portal]
host = 0.0.0.0
port = 8888
secret_key = change-me-portal-secret

[paths]
# Where instance state is tracked
state_dir = /var/lib/pwnbox
wireguard_dir = /etc/wireguard
